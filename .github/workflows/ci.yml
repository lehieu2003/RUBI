name: CI

# The web app. Changes that only touch the mobile app run mobile.yml instead.
# The planning notes in .planning/ are written with every task and hold no
# code, so they do not count as a change to the web app.
on:
  pull_request:
    paths-ignore:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
      - '.planning/**'
  push:
    branches:
      - master
      - dev
    paths-ignore:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
      - '.planning/**'

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/iceflow?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/iceflow?schema=public
      JWT_SECRET: ci-jwt-secret-for-builds-only

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iceflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iceflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch name and commit messages
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # The release PR (dev -> master) is the one PR whose head is a protected branch.
          if [ "$HEAD_REF" != "dev" ] || [ "$BASE_REF" != "master" ]; then
            bash scripts/validate.sh branch "$HEAD_REF"
          fi
          bash scripts/validate.sh range "origin/$BASE_REF" HEAD

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Check migrations match schema
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Seeds demo data, starts the built app and checks every endpoint's real
      # responses against the contracts in src/lib/contracts.
      - name: Verify API contracts against the running app
        run: |
          npm run db:seed
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > server.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/health > /dev/null && break
            sleep 1
          done
          BASE_URL=http://127.0.0.1:3000 npm run contract:verify || { tail -50 server.log; exit 1; }

      - name: Install the browser for the end-to-end tests
        run: npx playwright install --with-deps chromium

      # The main flows in a real browser (e2e/), on a database of their own so
      # they do not depend on what the contract verification left behind.
      - name: End-to-end tests in a browser
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/iceflow_e2e?schema=public
        run: |
          export DATABASE_URL="$E2E_DATABASE_URL" DIRECT_URL="$E2E_DATABASE_URL"
          npx prisma migrate deploy
          npm run db:seed
          cp -R .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -R public .next/standalone/; fi
          # HOSTNAME=localhost: the app builds its redirects from it, and the session cookie is per host.
          HOSTNAME=localhost PORT=3100 node .next/standalone/server.js > e2e-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf http://localhost:3100/api/health > /dev/null && break
            sleep 1
          done
          E2E_BASE_URL=http://localhost:3100 npx playwright test || { tail -50 e2e-server.log; exit 1; }

      - name: Upload the end-to-end report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
