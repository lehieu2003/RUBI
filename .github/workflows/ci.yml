name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - dev

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/iceflow?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/iceflow?schema=public
      JWT_SECRET: ci-jwt-secret-for-builds-only

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
