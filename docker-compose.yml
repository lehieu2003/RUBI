services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-dev-anon-key
      DATABASE_URL: postgresql://iceflow:iceflow@postgres:5432/iceflow?schema=public
      DIRECT_URL: postgresql://iceflow:iceflow@postgres:5432/iceflow?schema=public
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: iceflow
      POSTGRES_USER: iceflow
      POSTGRES_PASSWORD: iceflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceflow -d iceflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  node_modules:
  next_cache:
  postgres_data:
