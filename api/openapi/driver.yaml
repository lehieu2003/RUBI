                            - address
                            - phone
                          additionalProperties: false
                        orderItems:
                          type: array
                          items:
                            type: object
                            properties:
                              quantity:
                                type: integer
                                minimum: -9007199254740991
                                maximum: 9007199254740991
                              product:
                                type: object
                                properties:
                                  name:
                                    type: string
