  /api/d/{token}:
    get:
      operationId: getDriverLink
      tags:
        - Driver
      summary: Today's orders behind a driver share link
      description: |-
        Access: The share-link token in the path; no session..

        Returned WITHOUT the `{ success, data }` envelope; errors are `{ error }`. Rate limited to 30 per IP per minute.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
