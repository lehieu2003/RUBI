openapi: 3.1.0
info:
  title: "IceFlow API — Nhà máy đá tinh khiết Rubi: Sign-in, session and password"
  version: 1.0.0
paths:
  /api/auth/login:
    post:
      operationId: login
      tags:
        - Auth
      summary: Sign in with email and password
      description: |-
        Access: Public.

        Sets the httpOnly `auth_token` cookie (7 days) and also returns the JWT in `token` for non-browser clients. Rate limited to 5 attempts per IP per minute. The counter is keyed by the `x-real-ip` header and shared with `/api/auth/refresh`: without a proxy that sets `x-real-ip`, every client falls into one shared bucket.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                password:
                  type: string
                  minLength: 1
              required:
                - email
                - password
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            minLength: 1
                          email:
                            type: string
                          name:
                            type: string
                          role:
                            type: string
                            enum:
                              - ADMIN
                              - STAFF
                              - DRIVER
                          factoryId:
                            anyOf:
                              - type: string
                                minLength: 1
                              - type: "null"
                          mustChangePassword:
                            type: boolean
                        required:
                          - id
                          - email
                          - name
                          - role
                          - factoryId
                          - mustChangePassword
                        additionalProperties: false
                      token:
                        type: string
                    required:
                      - user
                      - token
                    additionalProperties: false
                required:
                  - success
                  - data
                additionalProperties: false
        "400":
          $ref: ./components/responses/errors.yaml#/BadRequest
        "401":
          $ref: ./components/responses/errors.yaml#/Unauthorized
        "403":
          $ref: ./components/responses/errors.yaml#/Forbidden
        "429":
          $ref: ./components/responses/errors.yaml#/TooManyRequests
        "500":
          $ref: ./components/responses/errors.yaml#/ServerError
  /api/auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      summary: Clear the session cookie
      description: "Access: Public."
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                        const: true
                    required:
                      - success
                    additionalProperties: false
                required:
                  - success
                  - data
                additionalProperties: false
  /api/auth/me:
    get:
      operationId: me
      tags:
        - Auth
      summary: "Current user, or `user: null` when not signed in"
      description: |-
        Access: Public.

        Never answers 401: an anonymous caller gets `{ user: null }`.
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      user:
                        anyOf:
                          - type: object
                            properties:
                              id:
                                type: string
                                minLength: 1
                              email:
                                type: string
                              name:
                                type: string
                              role:
                                type: string
                                enum:
                                  - ADMIN
                                  - STAFF
                                  - DRIVER
                              factoryId:
                                type: string
                                minLength: 1
                              mustChangePassword:
                                type: boolean
                            required:
                              - id
                              - email
                              - name
                              - role
                              - factoryId
                              - mustChangePassword
                            additionalProperties: false
                          - type: "null"
                    required:
                      - user
                    additionalProperties: false
                required:
                  - success
                  - data
                additionalProperties: false
        "403":
          $ref: ./components/responses/errors.yaml#/Forbidden
  /api/auth/refresh:
    post:
      operationId: refreshSession
      tags:
        - Auth
      summary: Exchange a still-valid session for a fresh 7-day JWT
      description: |-
        Access: Any signed-in user.

        Used by the mobile app. Rate limited to 30 per IP per minute, on the same counter as `/api/auth/login`, so refreshes also use up login attempts.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                    required:
                      - token
                    additionalProperties: false
                required:
                  - success
                  - data
                additionalProperties: false
        "401":
          $ref: ./components/responses/errors.yaml#/Unauthorized
        "429":
          $ref: ./components/responses/errors.yaml#/TooManyRequests
        "500":
          $ref: ./components/responses/errors.yaml#/ServerError
  /api/auth/password:
    post:
      operationId: changePassword
      tags:
        - Auth
      summary: Change your own password
      description: |-
        Access: Any signed-in user.

        New password: at least 8 characters, letters and digits, not a well-known password, different from the current one. Clears `mustChangePassword` and reissues the session cookie. Works even while a password change is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                  minLength: 1
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 72
              required:
                - currentPassword
                - newPassword
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                    required:
                      - token
                    additionalProperties: false
                required:
                  - success
                  - data
                additionalProperties: false
        "400":
          $ref: ./components/responses/errors.yaml#/BadRequest
        "401":
          $ref: ./components/responses/errors.yaml#/Unauthorized
        "429":
          $ref: ./components/responses/errors.yaml#/TooManyRequests
        "500":
          $ref: ./components/responses/errors.yaml#/ServerError
