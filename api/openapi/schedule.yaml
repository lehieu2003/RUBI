        "403":
          $ref: ./components/responses/errors.yaml#/Forbidden
        "500":
          $ref: ./components/responses/errors.yaml#/ServerError
    post:
      operationId: requestMyShift
      tags:
        - Schedule
      summary: Request a shift for yourself
      description: |-
        Access: STAFF, DRIVER.

        Created as PENDING. Repeating the request returns the existing shift unchanged; a REJECTED one becomes PENDING again. 400 for a past day or a slot of today that has ended; 409 `SHIFT_FULL` at the per-shift limit; 409 `PAYROLL_LOCKED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shiftDate:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                shift:
                  type: string
                  enum:
                    - SLOT_00_03
                    - SLOT_03_06
                    - SLOT_06_09
                    - SLOT_09_12
                    - SLOT_12_15
                    - SLOT_15_18
                    - SLOT_18_21
                    - SLOT_21_24
              required:
                - shiftDate
                - shift
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      shift:
                        type: object
                        properties:
                          shiftDate:
                            type: string
                            pattern: ^\d{4}-\d{2}-\d{2}$
                          shift:
                            type: string
                            enum:
                              - SLOT_00_03
                              - SLOT_03_06
                              - SLOT_06_09
                              - SLOT_09_12
                              - SLOT_12_15
                              - SLOT_15_18
                              - SLOT_18_21
                              - SLOT_21_24
                          status:
                            type: string
                            enum:
                              - PENDING
                              - APPROVED
                              - REJECTED
                        required:
                          - shiftDate
                          - shift
                          - status
                        additionalProperties: false
                    required:
                      - shift
                    additionalProperties: false
                required:
                  - success
                  - data
                additionalProperties: false
        "400":
          $ref: ./components/responses/errors.yaml#/BadRequest
        "401":
          $ref: ./components/responses/errors.yaml#/Unauthorized
        "403":
          $ref: ./components/responses/errors.yaml#/Forbidden
        "409":
          $ref: ./components/responses/errors.yaml#/Conflict
        "500":
          $ref: ./components/responses/errors.yaml#/ServerError
