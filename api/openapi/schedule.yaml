  /api/schedule/my:
    get:
      operationId: getMySchedule
      tags:
        - Schedule
      summary: The team's week, with the caller's own requests
      description: |-
        Access: STAFF, DRIVER.

        `today` and `currentHour` are Vietnam time. Other people's REJECTED requests are left out.
      parameters:
        - name: week
          in: query
          required: true
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                        minLength: 1
                      today:
                        type: string
                        pattern: ^\d{4}-\d{2}-\d{2}$
                      currentHour:
                        type: integer
                        minimum: 0
                        maximum: 23
                      limits:
                        type: object
                        properties:
                          STAFF:
                            anyOf:
                              - type: integer
                                minimum: -9007199254740991
                                maximum: 9007199254740991
                              - type: "null"
                          DRIVER:
                            anyOf:
                              - type: integer
                                minimum: -9007199254740991
                                maximum: 9007199254740991
                              - type: "null"
                        required:
                          - STAFF
                          - DRIVER
                        additionalProperties: false
                      lockedMonths:
                        type: array
                        items:
                          type: string
                          pattern: ^\d{4}-(0[1-9]|1[0-2])$
                      people:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              minLength: 1
                            name:
                              type: string
                            role:
                              type: string
                              enum:
                                - STAFF
                                - DRIVER
                            shifts:
                              type: array
                              items:
                                type: object
                                properties:
                                  shiftDate:
                                    type: string
                                    pattern: ^\d{4}-\d{2}-\d{2}$
                                  shift:
                                    type: string
                                    enum:
                                      - SLOT_00_03
                                      - SLOT_03_06
                                      - SLOT_06_09
                                      - SLOT_09_12
                                      - SLOT_12_15
                                      - SLOT_15_18
                                      - SLOT_18_21
                                      - SLOT_21_24
                                  status:
                                    type: string
                                    enum:
                                      - PENDING
                                      - APPROVED
                                      - REJECTED
                                required:
                                  - shiftDate
                                  - shift
                                  - status
                                additionalProperties: false
                          required:
                            - id
                            - name
                            - role
                            - shifts
                          additionalProperties: false
                    required:
                      - userId
                      - today
                      - currentHour
                      - limits
                      - lockedMonths
                      - people
                    additionalProperties: false
                required:
