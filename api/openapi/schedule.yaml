  /api/schedule/review:
    post:
      operationId: reviewShifts
      tags:
        - Schedule
      summary: Approve or reject shift requests
      description: |-
        Access: ADMIN.

        409 `PAYROLL_LOCKED` when any of the shifts is in a closed month.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  minItems: 1
                  maxItems: 500
                  type: array
                  items:
                    type: string
                    minLength: 1
                action:
                  type: string
                  enum:
                    - APPROVE
                    - REJECT
              required:
                - ids
                - action
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      updated:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                    required:
                      - updated
                    additionalProperties: false
                required:
                  - success
                  - data
                additionalProperties: false
        "400":
