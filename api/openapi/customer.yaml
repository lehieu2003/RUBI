        "403":
          $ref: ./components/responses/errors.yaml#/Forbidden
        "500":
          $ref: ./components/responses/errors.yaml#/ServerError
    post:
      operationId: createCustomer
      tags:
        - Customers
      summary: Create a customer
      description: |-
        Access: ADMIN.

        409 when the customer code already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 50
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                address:
                  type: string
