                phone:
                  type: string
                  maxLength: 30
                isActive:
                  type: boolean
              required:
                - code
                - name
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
