  /api/staff/{id}/rotate-link:
    post:
      operationId: rotateDriverLink
      tags:
        - Accounts
      summary: Replace a driver's share link; the old link stops working
      description: |-
        Access: ADMIN.

        `link` is a relative path such as `/d/<token>`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      link:
                        type: string
                      driverName:
                        type: string
                    required:
                      - link
                      - driverName
                    additionalProperties: false
                required:
                  - success
                  - data
                additionalProperties: false
        "400":
          $ref: ./components/responses/errors.yaml#/BadRequest
        "401":
          $ref: ./components/responses/errors.yaml#/Unauthorized
        "403":
          $ref: ./components/responses/errors.yaml#/Forbidden
        "404":
          $ref: ./components/responses/errors.yaml#/NotFound
        "500":
          $ref: ./components/responses/errors.yaml#/ServerError
  /api/drivers:
    get:
      operationId: listDrivers
      tags:
        - Accounts
      summary: Active drivers with an active DRIVER account
      description: |-
        Access: ADMIN, STAFF.

        Includes each driver's share-link `token`.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                        name:
                          type: string
                        phone:
                          anyOf:
                            - type: string
                            - type: "null"
                        slug:
                          type: string
                        token:
                          type: string
                        isActive:
                          type: boolean
                      required:
                        - id
                        - name
                        - phone
                        - slug
                        - token
                        - isActive
                      additionalProperties: false
                required:
                  - success
                  - data
                additionalProperties: false
        "400":
          $ref: ./components/responses/errors.yaml#/BadRequest
        "401":
