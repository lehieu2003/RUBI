  /api/staff/{id}:
    patch:
      operationId: updateStaff
      tags:
        - Accounts
      summary: Lock/unlock, rename, change role or reset the password of an account
      description: |-
        Access: ADMIN.

        Only the fields sent are changed. A password reset forces a change at next login. You cannot edit yourself (400) or a manager account (403).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isActive:
                  type: boolean
                password:
                  type: string
                  minLength: 1
                role:
                  type: string
                  enum:
                    - STAFF
                    - DRIVER
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
