      operationId: createDriver
      tags:
        - Accounts
      summary: "Not supported: drivers are created as DRIVER accounts through POST /api/staff"
      description: |-
        Access: ADMIN.

        Always answers 405 for a manager.
      responses:
        "401":
          $ref: ./components/responses/errors.yaml#/Unauthorized
        "403":
          $ref: ./components/responses/errors.yaml#/Forbidden
        "405":
          $ref: ./components/responses/errors.yaml#/MethodNotAllowed
